<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Document content is untrusted: only Docuna's own scripts may run (converted HTML can never
      execute code), and nothing is fetched from the network.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; connect-src file: blob: data:; base-uri 'none'; form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6, user-scalable=yes" />
    <link rel="stylesheet" href="office.css" />
  </head>
  <body>
    <div id="status" role="status">Opening…</div>
    <nav id="tabs" hidden></nav>
    <p id="notice" hidden></p>
    <main id="content"></main>
    <script src="office.js"></script>
  </body>
</html>
